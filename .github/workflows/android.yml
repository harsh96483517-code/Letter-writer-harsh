name: Android build

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

# Publishing the APK to a release needs write access to the repository contents.
permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee test.log

      # The raw job log is hard to fetch from outside GitHub, so surface the useful part
      # of a failed build as readable annotations on the run.
      - name: Surface build errors
        if: failure()
        run: |
          {
            grep -hE "^e: |error:|Unresolved|AAPT|Manifest merger|Could not (resolve|find|get)|Execution failed|FAILED" build.log test.log 2>/dev/null | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/android/app/src/(main|test)/java/app/writer/##' | head -80
            echo "----- failed tests"
            grep -hA7 " FAILED$" test.log 2>/dev/null | head -80
            echo "-----"
            grep -hA10 "What went wrong" build.log test.log 2>/dev/null | head -40
          } > errors.txt || true
          head -c 24000 errors.txt | split -b 3500 -d - chunk_ || true
          for f in chunk_*; do
            msg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' "$f" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle output ${f}::${msg}"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: writer-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # A release is the easiest way to get the APK onto a phone: open the Releases page on the
      # phone, tap the file, install. It is replaced by every successful build on main.
      - name: Publish APK to the "latest-debug" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" Writer-debug.apk
          SHORT=$(git rev-parse --short HEAD)
          cat > notes.md <<EOF
          Debug build of Writer from commit \`$SHORT\`. Built and unit-tested by GitHub Actions.

          Install: open this page on your Android phone, download **Writer-debug.apk**, tap it and allow installing from this source when asked.
          Builds are signed with the same debug key, so a newer build installs over an older one and keeps your documents.

          This is a debug build for testing, not a Play Store release. The app asks for no permissions and works offline.
          EOF
          gh release delete latest-debug --cleanup-tag --yes || true
          gh release create latest-debug Writer-debug.apk \
            --title "Writer debug APK ($SHORT)" \
            --notes-file notes.md \
            --prerelease \
            --target "$GITHUB_SHA"
